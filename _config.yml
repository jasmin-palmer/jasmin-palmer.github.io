title: Jasmin Palmer
description: My personal site
remote_theme: mmistakes/minimal-mistakes
plugins:
  - jekyll-remote-theme

# Optional: sets default layout for all pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single

# Navigation menu
navigation:
  - title: "Home"
    url: /
  - title: "About"
    url: /about/
  - title: "Projects"
    url: /projects/

# Optional settings
markdown: kramdown
highlighter: rouge
